name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore TuracoChorus.sln
      - run: dotnet build TuracoChorus.sln --no-restore --configuration Release
      - run: dotnet test TuracoChorus.sln --no-build --configuration Release
      - run: dotnet format TuracoChorus.sln --verify-no-changes

  build-and-push:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::300052334965:role/github-actions-turaco-chorus-deploy
          aws-region: af-south-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/turaco-chorus"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
